[package]
name = "idr-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dev-file-store"]
dev-file-store = [
    "idr-protocol/legacy-shadow-api",
    "idr-runtime/legacy-shadow-api",
]
postgres-store = ["idr-runtime/postgres-authority"]
trusted-clock = []
transactional-outbox = []
audit-anchor = []
shadow-mode = ["postgres-store", "idr-runtime/shadow-mode"]
migration = ["postgres-store", "idr-runtime/migration"]
production = [
    "postgres-store",
    "trusted-clock",
    "transactional-outbox",
    "audit-anchor",
    "idr-runtime/production",
    "idr-protocol/production",
]

[dependencies]
async-trait.workspace = true
fs2.workspace = true
idr-protocol = { path = "../idr-protocol", default-features = false, features = ["crypto-proofs"] }
idr-runtime = { path = "../idr-runtime", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
sqlx.workspace = true
idr-runtime = { path = "../idr-runtime", default-features = false, features = ["test-support"] }

[[test]]
name = "postgres_trust_chain"
path = "tests/postgres_trust_chain.rs"
required-features = ["shadow-mode"]

[[test]]
name = "postgres_vertical_slice"
path = "tests/postgres_vertical_slice.rs"
required-features = ["shadow-mode"]
